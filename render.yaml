# Render Blueprint — https://render.com/docs/blueprint-spec
# API service + static marketing site (moved off Vercel).
services:
  # Marketing UI + /docs agent integration folder (was on Vercel; now Render static)
  - type: web
    name: exit-guard-site
    runtime: static
    rootDir: site
    buildCommand: "true"
    staticPublishPath: .

  - type: web
    name: exit-guard
    runtime: node
    plan: free
    region: oregon
    rootDir: exit-guard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOST
        value: "0.0.0.0"
      - key: BASE_RPC_URL
        value: https://base.publicnode.com
      - key: X402_ENABLED
        value: "true"
      - key: X402_CALL_PRICE_USDC
        value: "0.02"
      - key: X402_FACILITATOR_URL
        value: https://facilitator.payai.network
      - key: DEFAULT_FEE_BPS
        value: "30"
      - key: DEFAULT_SLIPPAGE_BPS
        value: "300"
      - key: KEEPALIVE_URL
        value: https://exit-guard.onrender.com/ping
      - key: KEEPALIVE_INTERVAL_MS
        value: "60000"
      # Set these as secret values in the Render dashboard (or CLI) — do not commit secrets
      - key: KEEPERHUB_API_KEY
        sync: false
      - key: KEEPERHUB_WALLET_ADDRESS
        sync: false
      - key: EXECUTOR_ADDRESS
        sync: false
      - key: X402_PAY_TO
        sync: false
      - key: KEEPERHUB_BASE_URL
        value: https://app.keeperhub.com
